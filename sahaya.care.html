    // --- AUDIO & WEB SPEECH SYNTHESIS ENGINE ---
    class OfflineAudioEngine {
      constructor() {
        this.ctx = null;
      }
      initAudio() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
      }
      playChime(type = 'tap') {
        try {
          this.initAudio();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          const now = this.ctx.currentTime;
          if (type === 'success') {
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
            osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc.start(now);
            osc.stop(now + 0.35);
          } else {
            osc.frequency.setValueAtTime(440, now);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
          }
        } catch (e) {}
      }
      speak(text, lang = 'English', speed = 0.85, onEnd = null) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = speed;
        if (lang === 'Telugu') u.lang = 'te-IN';
        else if (lang === 'Hindi') u.lang = 'hi-IN';
        else u.lang = 'en-US';
        if (onEnd) u.onend = onEnd;
        window.speechSynthesis.speak(u);
      }
      stop() {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
      }
    }

              {isBloodDonorOpen && (
                <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
                  <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4 text-slate-900">
                    <div className="flex items-center justify-between border-b pb-3">
                      <h3 className="text-lg font-black text-rose-700 flex items-center gap-2">
                        <span>🩸</span>
                        <span>Blood Donor Search Network</span>
                      </h3>
                      <button onClick={() => setIsBloodDonorOpen(false)} className="text-slate-400 text-lg">✕</button>
                    </div>
                    <div className="space-y-2">
                      {[{ name: 'K. Satish', grp: 'O+', dist: '2.1 km', ph: '9848099881' }, { name: 'P. Anand', grp: 'B+', dist: '3.4 km', ph: '9848077662' }].map((d, i) => (
                        <div key={i} className="p-3 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between text-xs">
                          <div>
                            <span className="font-black text-slate-900">{d.name} ({d.grp})</span>
                            <p className="text-slate-500 font-medium">{d.dist} away</p>
                          </div>
                          <a href={`tel:${d.ph}`} className="px-3 py-1.5 rounded-xl bg-rose-600 text-white font-black">Call</a>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* Rural Health Modal */}
              {isRuralHealthOpen && (
                <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
                  <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4 text-slate-900">
                    <div className="flex items-center justify-between border-b pb-3">
                      <h3 className="text-lg font-black text-teal-800 flex items-center gap-2">
                        <span>🏥</span>
                        <span>Rural Health Centers & ASHA Workers</span>
                      </h3>
                      <button onClick={() => setIsRuralHealthOpen(false)} className="text-slate-400 text-lg">✕</button>
                    </div>
                    <div className="space-y-2.5 text-xs">
                      <div className="p-3 rounded-xl bg-teal-50 border border-teal-200">
                        <span className="font-black text-teal-900 block">Village Primary Health Center (PHC)</span>
                        <p className="text-slate-600">Open 24/7 for emergency delivery & first aid.</p>
                      </div>
                      <div className="p-3 rounded-xl bg-slate-50 border border-slate-200">
                        <span className="font-black text-slate-900 block">ASHA Worker: Lakshmi Devi</span>
                        <p className="text-slate-600">Free medicine kit & immunization support.</p>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* Disease Guide Modal */}
              {isDiseaseDetailsOpen && (
                <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
                  <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4 text-slate-900">
                    <div className="flex items-center justify-between border-b pb-3">
                      <h3 className="text-lg font-black text-amber-800 flex items-center gap-2">
                        <span>🩺</span>
                        <span>In-Depth Chronic Disease Guide</span>
                      </h3>
                      <button onClick={() => setIsDiseaseDetailsOpen(false)} className="text-slate-400 text-lg">✕</button>
                    </div>
                    <div className="space-y-2 text-xs">
                      <div className="p-3 rounded-xl bg-amber-50 border border-amber-200">
                        <strong>Hypertension (BP):</strong> Limit salt, take morning tablet with water, avoid sudden standing.
                      </div>
                      <div className="p-3 rounded-xl bg-amber-50 border border-amber-200">
                        <strong>Diabetes (Sugar):</strong> Avoid empty stomach medication, keep sugar candy for sudden dizziness.
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* Ask AI Chatbot Modal (Offline Knowledge Engine) */}
              {isChatbotOpen && (
                <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
                  <div className="bg-white rounded-3xl p-6 max-w-lg w-full shadow-2xl space-y-4 text-slate-900">
                    <div className="flex items-center justify-between border-b pb-3">
                      <h3 className="text-lg font-black text-indigo-900 flex items-center gap-2">
                        <span>🤖</span>
                        <span>Sahaaya AI Care Assistant</span>
                      </h3>
                      <button onClick={() => setIsChatbotOpen(false)} className="text-slate-400 text-lg">✕</button>
                    </div>
                    <div className="p-4 rounded-2xl bg-indigo-50 border border-indigo-200 text-xs text-indigo-950 space-y-2">
                      <p className="font-bold">
                        {selectedLanguage === 'Telugu'
                          ? 'నమస్కారం! నేను సహాయ కేర్ అసిస్టెంట్. మందుల సమయాలు, రంగుల గుర్తులు మరియు జాగ్రత్తల గురించి అడగండి.'
                          : 'Hello! I am Sahaaya Care Assistant. Ask any question about your medicine schedule, colors, and instructions.'}
                      </p>
                    </div>
                    <div className="flex gap-2">
                      <input
                        type="text"
                        placeholder="Type your health or medicine question..."
                        className="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs"
                      />
                      <button
                        onClick={() => audioEngine.speak('Take your yellow pill after breakfast with a full glass of water.', selectedLanguage, speechSpeed)}
                        className="px-4 py-2.5 rounded-xl bg-indigo-600 text-white font-black text-xs"
                      >
                        Ask
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Quick Add Medicine Modal */}
              {isQuickAddOpen && (
                <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
                  <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4 text-slate-900">
                    <div className="flex items-center justify-between border-b pb-3">
                      <h3 className="text-lg font-black text-slate-900">+ Add Tablet / Medicine</h3>
                      <button onClick={() => setIsQuickAddOpen(false)} className="text-slate-400 text-lg">✕</button>
                    </div>
                    <form
                      onSubmit={(e) => {
                        e.preventDefault();
                        const name = e.target.medName.value;
                        const dose = e.target.medDose.value;
                        if (name) {
                          setSchedule(prev => ({
                            ...prev,
                            medicines: [
                              ...prev.medicines,
                              {
                                id: `med-custom-${Date.now()}`,
                                name,
                                dosage: dose || '1 dose',
                                purpose: 'Daily health prescription',
                                color: 'Emerald Green',
                                colorHex: '#10B981',
                                shape: 'round',
                                slots: ['morning'],
                                daysOfWeek: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                                withFood: 'after_meal',
                                waterRequirement: 'full_glass',
                                spokenExplanation: `Take your green ${name} tablet with water.`
                              }
                            ]
                          }));
                          setIsQuickAddOpen(false);
                          audioEngine.playChime('success');
                        }
                      }}
                      className="space-y-3 text-xs"
                    >
                      <div>
                        <label className="block font-bold mb-1">Medicine Name *</label>
                        <input name="medName" required placeholder="e.g. Paracetamol, Pantocid..." className="w-full px-3.5 py-2.5 rounded-xl border" />
                      </div>
                      <div>
                        <label className="block font-bold mb-1">Dosage</label>
                        <input name="medDose" placeholder="e.g. 500mg, 1 tablet" className="w-full px-3.5 py-2.5 rounded-xl border" />
                      </div>
                      <button type="submit" className="w-full py-3 rounded-2xl bg-indigo-600 text-white font-black text-xs cursor-pointer shadow-md">
                        Save to Schedule
                      </button>
                    </form>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<SahaayaApp />, document.getElementById('root'));
  </script>
</body>
</html>
